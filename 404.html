<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found — HSE Lab</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background: #FCFCFD;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      main { max-width: 36rem; text-align: center; }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #1d4ed8;
        font-weight: 600;
      }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 1rem 0; line-height: 1.1; }
      p { color: #475569; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        background: #0f172a;
        color: #fff;
        text-decoration: none;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
    </style>
    <script>
      (function () {
        var pathname = window.location.pathname || '/';
        var search = window.location.search ? window.location.search.slice(1).replace(/&/g, '~and~') : '';
        var hash = window.location.hash ? window.location.hash.slice(1) : '';
        var query = '?p=' + pathname + (search ? '%3F' + search : '') + (hash ? '&h=' + hash : '');
        window.location.replace('/' + query);
      })();
    </script>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 — Page Not Found</p>
      <h1>Redirecting…</h1>
      <p>If you are not redirected automatically, the page you requested may have moved or no longer exists.</p>
      <a href="/">Go to HSE Lab home</a>
    </main>
  </body>
</html>
